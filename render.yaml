services:
  - type: web
    name: productsift
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Live by default - every visitor shares this deployment's GROQ_API_KEY,
      # protected by the per-IP rate limiter in server/index.js (10 LLM
      # requests/minute) rather than by defaulting to demo data. That limiter
      # stops one IP from burning the whole quota in a burst; it does not cap
      # total requests across many different visitors, so a shared free-tier
      # quota (1,000 requests/day for the default model) can still run out
      # under enough real traffic - set MOCK_MODE to "true" in the Render
      # dashboard if that tradeoff isn't the one you want for a given deploy.
      - key: MOCK_MODE
        value: "false"
      # Set in the Render dashboard (Environment tab) - never committed.
      - key: GROQ_API_KEY
        sync: false
      # Optional - enables the "Share" button (a persisted, linkable project).
      # A free Postgres connection string from https://neon.tech works well.
      # Leave unset in the dashboard and sharing is simply disabled.
      - key: DATABASE_URL
        sync: false
