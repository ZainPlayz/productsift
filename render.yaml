services:
  - type: web
    name: productsift
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Public deployments default to mock mode - a shared free-tier Groq
      # quota (1,000 requests/day for the default model) would otherwise be
      # exhausted by enough visitors clicking around, breaking the demo for
      # everyone including the owner. Flip to "false" once GROQ_API_KEY is
      # set, if you want this specific deployment to run live analysis.
      - key: MOCK_MODE
        value: "true"
      # Set in the Render dashboard (Environment tab) - never committed.
      - key: GROQ_API_KEY
        sync: false
      # Optional - enables the "Share" button (a persisted, linkable project).
      # A free Postgres connection string from https://neon.tech works well.
      # Leave unset in the dashboard and sharing is simply disabled.
      - key: DATABASE_URL
        sync: false
