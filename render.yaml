services:
  - type: web
    name: productsift
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Public deployments default to mock mode - a shared free-tier Gemini
      # quota (20 requests/day) would otherwise be exhausted by the first
      # few visitors, breaking the demo for everyone including the owner.
      # Flip to "false" once GEMINI_API_KEY is set, if you want this
      # specific deployment to run live analysis instead.
      - key: MOCK_MODE
        value: "true"
      # Set in the Render dashboard (Environment tab) - never committed.
      - key: GEMINI_API_KEY
        sync: false
